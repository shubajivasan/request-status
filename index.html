<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Status — Ajivasan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:opsz,wght@5..1200,400;5..1200,500;5..1200,600;5..1200,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#33090F;
    --paper-raised:#4A1119;
    --paper-raised-2:#551420;
    --ink:#F4E7D3;
    --ink-soft:#CBA477;
    --line:#7A4326;
    --gold:#D8B26A;
    --gold-bright:#F0CE8F;
    --teal:#4FA97C;
    --teal-soft:rgba(79,169,124,0.16);
    --amber:#E0912F;
    --amber-soft:rgba(224,145,47,0.16);
    --terracotta:#E27587;
    --terracotta-soft:rgba(226,117,135,0.16);
    --slate:#9BB0C4;
    --slate-soft:rgba(155,176,196,0.15);
    --indigo:#B49AE0;
    --indigo-soft:rgba(180,154,224,0.16);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(90,20,25,0.55), transparent 60%),
      radial-gradient(ellipse 900px 600px at 100% 110%, rgba(20,5,8,0.65), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px;}

  header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .brand{font-family:'Playfair Display',serif;font-weight:600;font-size:27px;letter-spacing:.01em;color:var(--gold);}
  .brand small{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:11.5px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;}
  .staff-toggle{font-size:13px;color:var(--ink-soft);background:none;border:1px solid var(--line);padding:7px 14px;border-radius:999px;cursor:pointer;font-family:'Inter',sans-serif;transition:.15s;}
  .staff-toggle:hover{border-color:var(--ink-soft);color:var(--ink);}

  /* Department selector */
  .dept-bar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .dept-card{
    flex:1;min-width:200px;
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;cursor:pointer;transition:.15s;
  }
  .dept-card:hover{border-color:var(--gold);}
  .dept-card.active{border-color:var(--gold);background:linear-gradient(180deg, rgba(216,178,106,0.10), transparent);}
  .dept-card .dept-name{font-family:'Playfair Display',serif;font-size:16.5px;font-weight:600;color:var(--ink);}
  .dept-card .dept-sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}

  .panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:22px;}
  .panel h2{font-family:'Playfair Display',serif;font-weight:500;font-size:19px;margin:0 0 4px;}
  .panel p.hint{margin:0 0 18px;color:var(--ink-soft);font-size:14px;}

  .row{display:flex;gap:10px;flex-wrap:wrap;}
  input[type=email],input[type=text],input[type=password],input[type=date],select,textarea{
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--paper-raised-2);
    color:var(--ink);
    flex:1;
    min-width:180px;
  }
  input::placeholder,textarea::placeholder{color:var(--ink-soft);opacity:.7;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  textarea{width:100%;resize:vertical;min-height:60px;font-family:'Inter',sans-serif;}

  button.primary{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    background:var(--gold);color:#33090F;border:none;
    padding:11px 20px;border-radius:9px;cursor:pointer;transition:.15s;
    white-space:nowrap;
  }
  button.primary:hover{background:var(--gold-bright);}
  button.primary:disabled{opacity:.5;cursor:default;}
  button.ghost{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    background:none;color:var(--ink-soft);border:1px solid var(--line);
    padding:8px 14px;border-radius:8px;cursor:pointer;
  }
  button.ghost:hover{border-color:var(--ink-soft);color:var(--ink);}

  .msg{font-size:13.5px;padding:10px 14px;border-radius:8px;margin-top:12px;}
  .msg.error{background:var(--terracotta-soft);color:var(--terracotta);}
  .msg.ok{background:var(--teal-soft);color:var(--teal);}

  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:6px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .live-note{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;margin-top:2px;}

  .ticket{
    position:relative;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:16px;
    display:flex;
    overflow:hidden;
  }
  .ticket .spine{
    width:8px;
    background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 13px);
    flex-shrink:0;
    position:relative;
  }
  .ticket .spine::before,.ticket .spine::after{
    content:'';position:absolute;left:-8px;width:16px;height:16px;border-radius:50%;
    background:var(--paper);border:1px solid var(--line);
  }
  .ticket .spine::before{top:-9px;}
  .ticket .spine::after{bottom:-9px;}
  .ticket .body{padding:18px 20px;flex:1;min-width:0;}

  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px;}
  .ticket-id{
    font-family:'Inter',monospace;font-size:11.5px;font-weight:700;letter-spacing:.03em;
    color:var(--gold);background:rgba(216,178,106,0.12);border:1px solid var(--line);
    padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:6px;
  }
  .ticket-type{font-family:'Playfair Display',serif;font-size:16.5px;font-weight:500;}
  .ticket-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .status-pill{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;}
  .status-Pending{background:rgba(216,178,106,0.18);color:var(--gold);}
  .status-Completed{background:var(--teal-soft);color:var(--teal);}
  .status-In-Process{background:var(--amber-soft);color:var(--amber);}
  .status-On-Hold{background:var(--slate-soft);color:var(--slate);}
  .status-Cancelled{background:var(--terracotta-soft);color:var(--terracotta);}
  .status-Ordered-new{background:var(--indigo-soft);color:var(--indigo);}

  .ticket-details{font-size:14.5px;line-height:1.5;color:var(--ink);margin-bottom:10px;}
  .ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .ticket-grid b{color:var(--ink);font-weight:600;}
  .ticket-remark{
    background:var(--paper);border:1px dashed var(--line);border-radius:9px;
    padding:10px 12px;font-size:13px;color:var(--ink-soft);white-space:pre-wrap;margin-bottom:10px;
  }
  .ticket-remark b{color:var(--ink);}

  .comment-row{display:flex;gap:8px;margin-top:8px;}
  .comment-row textarea{min-height:38px;font-size:13.5px;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .glyph{font-family:'Playfair Display',serif;font-size:34px;color:var(--line);margin-bottom:10px;}

  .staff-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}
  .staff-controls select{flex:0 0 auto;min-width:150px;}
  .staff-controls input{flex:0 0 auto;min-width:150px;}

  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-bar button{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper-raised);
    color:var(--ink-soft);cursor:pointer;
  }
  .filter-bar button.active{background:var(--gold);color:#33090F;border-color:var(--gold);}

  footer{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:30px;}

  .tab-bar{display:flex;gap:6px;margin-bottom:16px;}
  .tab-bar button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;
    padding:9px 16px;border-radius:9px;border:1px solid var(--line);
    background:var(--paper-raised);color:var(--ink-soft);cursor:pointer;transition:.15s;
  }
  .tab-bar button.active{background:var(--gold);color:#33090F;border-color:var(--gold);}

  .field-label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:0 0 5px;}
  .field-group{margin-bottom:14px;}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;}
  .field-row .field-group{flex:1;min-width:160px;}

  @media (max-width:520px){
    .ticket-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">Request Status<small>Ajivasan</small></div>
    <button class="staff-toggle" id="staffToggleBtn" type="button">Staff sign in</button>
  </header>

  <div class="dept-bar" id="deptBar"></div>

  <!-- SUBMITTER VIEW -->
  <div id="submitterView">
    <div class="tab-bar">
      <button id="tabCheckBtn" class="active" type="button">Check my requests</button>
      <button id="tabNewBtn" type="button">New request</button>
    </div>

    <div id="checkTab">
      <div class="panel">
        <h2>Check your requests</h2>
        <p class="hint" id="checkHint"></p>
        <div class="row">
          <input type="text" id="searchInput" placeholder="">
          <button class="primary" id="lookupBtn" type="button">Show my requests</button>
        </div>
        <div id="submitterMsg"></div>
        <div class="live-note" id="liveNoteSubmitter" style="display:none;"><span class="live-dot"></span>Live — refreshing automatically</div>
      </div>
      <div id="submitterFilterBar" class="filter-bar" style="display:none;"></div>
      <div id="submitterResults"></div>
    </div>

    <div id="newTab" style="display:none;"></div>
  </div>

  <!-- STAFF VIEW -->
  <div id="staffView" style="display:none;">
    <div class="panel">
      <h2>Staff sign in</h2>
      <p class="hint" id="staffLoginHint">Enter the staff passcode to view and update requests.</p>
      <div class="row">
        <input type="password" id="passcodeInput" placeholder="Passcode">
        <button class="primary" id="staffLoginBtn" type="button">Sign in</button>
        <button class="ghost" id="backToSubmitterBtn" type="button">Back</button>
      </div>
      <div id="staffMsg"></div>
    </div>

    <div id="staffDashboard" style="display:none;">
      <div class="panel" style="padding:16px 20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div class="live-note"><span class="live-dot"></span>Live — refreshing automatically</div>
          <div style="display:flex;gap:8px;">
            <button class="ghost" id="staffNewToggleBtn" type="button">+ New request</button>
            <button class="ghost" id="signOutBtn" type="button">Sign out</button>
          </div>
        </div>
      </div>
      <div id="staffNewWrap" style="display:none;"></div>
      <div class="filter-bar" id="filterBar"></div>
      <div id="staffResults"></div>
    </div>
  </div>

  <footer>Updates every 15s</footer>
</div>

<script>
/* ====================== CONFIG ====================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxxhh1S2OgGayFJBLztvDhYpUX3Z8txRHMYp7hQ5EZwKIdqMH7iH-bnEhK3bO50x9xT/exec';
const POLL_MS = 15000;

// Mirrors the DEPARTMENTS config in Code.gs — keep both in sync when editing.
const DEPARTMENTS = {
  adminit: {
    label: 'Admin & IT',
    sub: 'IT equipment, admin & facilities requests',
    searchLabel: 'Email address',
    searchType: 'email',
    searchPlaceholder: 'you@example.com',
    titleField: 'Request Type',
    nameField: 'Your Name',
    detailField: 'Deatils Of Your Concern / Requirement.',
    statusField: 'Current Status',
    commentField: 'Custom Remark',
    statusOptions: ['Pending','In Process','Completed','On Hold','Cancelled','Ordered new'],
    formFields: [
      { key:'name',         header:'Your Name',                                   label:'Your name',       type:'text',     required:true },
      { key:'department',   header:'Your Department',                             label:'Your department', type:'text' },
      { key:'requestType',  header:'Request Type',                                label:'Request type',    type:'select', required:true, options:['IT','Admin'] },
      { key:'email',        header:'Email Address',                               label:'Email address',   type:'email',    required:true },
      { key:'details',      header:'Deatils Of Your Concern / Requirement.',      label:'Details of your concern / requirement', type:'textarea', required:true },
      { key:'locationType', header:'Location Of Concern',                         label:'Location of concern', type:'select', options:['Niketan','Branch','School'] },
      { key:'locationName', header:'Location Name (Branch / School / NGO)',       label:'Location name (branch/school/NGO)', type:'text' },
      { key:'deadline',     header:'Date Required / Deadline',                    label:'Date required / deadline', type:'date' }
    ],
    updateFields: [
      { key:'remark',         header:'Expected Completion Date / Remark', label:'Remark',          type:'text' },
      { key:'completionDate', header:'Completion Date',                   label:'Completion date', type:'date' }
    ]
  },
  creatives: {
    label: 'Creatives Requirement',
    sub: 'Design, video & social media requests',
    searchLabel: 'Email address',
    searchType: 'email',
    searchPlaceholder: 'you@example.com',
    titleField: 'Type Of Creative/Post',
    nameField: 'Task Alloted By:',
    detailField: 'Captions/Suggestions:',
    statusField: 'Status By Marketing Team',
    commentField: 'Custom Remark',
    statusOptions: ['Pending','In Process','Completed','On Hold','Cancelled'],
    formFields: [
      { key:'type',           header:'Type Of Creative/Post', label:'Type of creative/post', type:'select', required:true,
        options:['Static','Video'] },
      { key:'purpose',        header:'Purpose Of Creative',   label:'Purpose of creative', type:'select',
        options:['Digital Campaign','Social Media','Whatsapp Promotions','Flyer','Standee','Banner','News Papaer Advt','Book My Show / District','Ajivasan Website'] },
      { key:'size',           header:'Size Of Creative',      label:'Size of creative', type:'select',
        options:['A5','A4','A3','1:1 (For Posts Of Social Media & Whatsapp)','4:3 (For Posts Of Social Media & Whatsapp)','9:16 (For Reels & Stories Of Social Media & Whatsapp)','BookMyShow Specific Sizes','6 x 4 (Standee)','Banner (Mention Size In Creative Description Field)'] },
      { key:'otherDesc',      header:'Creative Description (If "Other" Selected In The Above Question)', label:'Creative description (if "Other" selected above)', type:'textarea', required:true },
      { key:'name',           header:'Task Alloted By:',      label:'Task alloted by', type:'text', required:true },
      { key:'email',          header:'Email Address',         label:'Email address',   type:'email', required:true },
      { key:'deadline',       header:'Deadline:',             label:'Deadline',        type:'date', required:true },
      { key:'captions',       header:'Captions/Suggestions:', label:'Captions/suggestions', type:'textarea' },
      { key:'referenceLinks', header:'Reference Links (If Any Photo/Video)', label:'Reference links (if any photo/video)', type:'text' }
    ],
    updateFields: [
      { key:'completionDate', header:'Date Of Completion',    label:'Completion date', type:'date' },
      { key:'deliveredOn',    header:'Creative Delivered On', label:'Delivered on',    type:'date' }
    ]
  }
};
/* ====================================================== */

let currentDept = 'adminit';
let submitterEmail = null; // holds the search value (email or name depending on dept)
let submitterPollTimer = null;
let staffPasscode = null;
let staffPollTimer = null;
let staffFilter = 'All';
let submitterCache = [];
let submitterFilter = 'All';
let staffCache = [];
let staffFormBuilt = { adminit:false, creatives:false };

// ---------- API helper ----------
async function api(action, extra) {
  const payload = Object.assign({ action, department: currentDept }, extra || {});
  const isWrite = ['addComment','updateStatus','staffAuth','staffRequests','submitRequest'].includes(action);
  let res;
  if (isWrite) {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
  } else {
    const qs = new URLSearchParams(payload).toString();
    res = await fetch(API_URL + '?' + qs);
  }
  const json = await res.json();
  if (!json.success) throw new Error(json.error || 'Request failed');
  return json.data;
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function statusClass(s){ return 'status-' + String(s||'').trim().replace(/\s+/g,'-'); }
function normStatus(s){ return String(s||'').trim(); }
function cfg(){ return DEPARTMENTS[currentDept]; }

// ---------- Department bar ----------
function renderDeptBar(){
  const bar = document.getElementById('deptBar');
  bar.innerHTML = Object.keys(DEPARTMENTS).map(k => `
    <div class="dept-card ${k===currentDept?'active':''}" data-dept="${k}">
      <div class="dept-name">${esc(DEPARTMENTS[k].label)}</div>
      <div class="dept-sub">${esc(DEPARTMENTS[k].sub)}</div>
    </div>`).join('');
  bar.querySelectorAll('.dept-card').forEach(card => {
    card.addEventListener('click', () => switchDept(card.dataset.dept));
  });
}

function switchDept(key){
  if (key === currentDept) return;
  currentDept = key;
  renderDeptBar();

  // Reset submitter state
  submitterEmail = null;
  submitterCache = [];
  submitterFilter = 'All';
  document.getElementById('searchInput').value = '';
  document.getElementById('submitterResults').innerHTML = '';
  document.getElementById('submitterFilterBar').style.display = 'none';
  document.getElementById('liveNoteSubmitter').style.display = 'none';
  document.getElementById('submitterMsg').innerHTML = '';
  clearInterval(submitterPollTimer);
  updateSearchPanelText();

  // Always land back on "Check my requests" so a leftover open form doesn't carry over
  document.getElementById('tabCheckBtn').classList.add('active');
  document.getElementById('tabNewBtn').classList.remove('active');
  document.getElementById('checkTab').style.display = 'block';
  document.getElementById('newTab').style.display = 'none';

  // Rebuild new-request tab for this department
  document.getElementById('newTab').innerHTML = requestFormHtml('pub');
  wireRequestForm('pub');

  // Passcodes are department-scoped now — sign out so the other team has to
  // enter their own passcode rather than reusing this one across departments.
  if (staffPasscode) {
    staffPasscode = null;
    clearInterval(staffPollTimer);
    staffFilter = 'All';
    staffCache = [];
    document.getElementById('staffDashboard').style.display = 'none';
    document.getElementById('staffNewWrap').innerHTML = '';
    document.getElementById('staffNewWrap').style.display = 'none';
    document.getElementById('staffNewToggleBtn').textContent = '+ New request';
    document.getElementById('passcodeInput').value = '';
    document.getElementById('staffMsg').innerHTML = `<div class="msg ok">Switched department — sign in again with the ${cfg().label} passcode.</div>`;
    staffFormBuilt = { adminit:false, creatives:false };
  }
}

function updateSearchPanelText(){
  const c = cfg();
  document.getElementById('checkHint').textContent =
    c.searchType === 'email'
      ? 'Enter the email address you used when you submitted the form.'
      : 'Enter the name you used as "Task Alloted By" on the form.';
  const input = document.getElementById('searchInput');
  input.type = c.searchType === 'email' ? 'email' : 'text';
  input.placeholder = c.searchPlaceholder;
  document.getElementById('staffLoginHint').textContent =
    `Enter the ${c.label} staff passcode to view and update these requests.`;
}

// ---------- Ticket rendering ----------
function ticketHtml(r, opts){
  opts = opts || {};
  const c = cfg();
  const status = r[c.statusField];
  const comment = c.commentField ? r[c.commentField] : null;
  const showStaffControls = !!opts.staff;

  let remarkBlock = '';
  if (comment) {
    remarkBlock = `<div class="ticket-remark">${esc(comment)}</div>`;
  }

  // Info grid: all form fields except title/name/detail, which are shown elsewhere
  const skipKeys = new Set([c.titleField, c.nameField, c.detailField]);
  const gridFields = c.formFields.filter(f => !skipKeys.has(f.header) && r[f.header]);
  const gridHtml = gridFields.length ? `<div class="ticket-grid">${
    gridFields.map(f => `<div><b>${esc(f.label)}:</b> ${esc(r[f.header])}</div>`).join('')
  }</div>` : '';

  let staffControls = '';
  if (showStaffControls) {
    const statusOpts = c.statusOptions.map(s => `<option value="${s}" ${s===normStatus(status)?'selected':''}>${s}</option>`).join('');
    const updateInputs = (c.updateFields||[]).map(f => {
      if (f.type === 'date') {
        return `<input type="date" class="ufield" data-key="${f.key}" data-row="${r.rowIndex}" placeholder="${esc(f.label)}">`;
      }
      return `<input type="text" class="ufield" data-key="${f.key}" data-row="${r.rowIndex}" placeholder="${esc(f.label)}" value="${esc(r[f.header]||'')}">`;
    }).join('');
    staffControls = `
      <div class="staff-controls">
        <select data-row="${r.rowIndex}" class="statusSelect">${statusOpts}</select>
        ${updateInputs}
        <button class="primary saveBtn" data-row="${r.rowIndex}" type="button">Update</button>
      </div>`;
  }

  let commentRow = '';
  if (opts.submitter && c.commentField) {
    commentRow = `
      <div class="comment-row">
        <textarea placeholder="Add a comment for the team..." class="commentInput" data-row="${r.rowIndex}"></textarea>
        <button class="primary commentBtn" data-row="${r.rowIndex}" type="button">Send</button>
      </div>`;
  }

  return `
    <div class="ticket">
      <div class="spine"></div>
      <div class="body">
        <div class="ticket-top">
          <div>
            <div class="ticket-id">${esc(r['Ticket ID'])}</div>
            <div class="ticket-type">${esc(r[c.titleField])}</div>
            <div class="ticket-meta">${esc(r[c.nameField])} · ${esc(r['Timestamp'])}</div>
          </div>
          <span class="status-pill ${statusClass(status)}">${esc(status||'—')}</span>
        </div>
        <div class="ticket-details">${esc(r[c.detailField]||'')}</div>
        ${gridHtml}
        ${remarkBlock}
        ${staffControls}
        ${commentRow}
      </div>
    </div>`;
}

// ---------- New Request form (shared by submitter + staff views) ----------
function requestFormHtml(prefix){
  const c = cfg();
  const fieldsHtml = c.formFields.map(f => {
    const req = f.required ? ' *' : '';
    let inputHtml;
    if (f.type === 'select') {
      inputHtml = `<select id="${prefix}_${f.key}">${f.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
    } else if (f.type === 'textarea') {
      inputHtml = `<textarea id="${prefix}_${f.key}" style="min-height:70px;"></textarea>`;
    } else {
      inputHtml = `<input type="${f.type}" id="${prefix}_${f.key}">`;
    }
    return `<div class="field-group"><label class="field-label">${esc(f.label)}${req}</label>${inputHtml}</div>`;
  }).join('');

  return `
    <div class="panel">
      <h2>Submit a new request</h2>
      <p class="hint">Fill in the details below — this is added directly to the ${esc(c.label)} tracker.</p>
      ${fieldsHtml}
      <button class="primary" id="${prefix}SubmitBtn" type="button">Submit request</button>
      <div id="${prefix}Msg"></div>
    </div>`;
}

function wireRequestForm(prefix, onSuccess){
  const c = cfg();
  const deptAtBind = currentDept;
  document.getElementById(prefix + 'SubmitBtn').addEventListener('click', async () => {
    if (currentDept !== deptAtBind) return; // stale handler from a previous department render
    const msgEl = document.getElementById(prefix + 'Msg');
    const btn = document.getElementById(prefix + 'SubmitBtn');
    const payload = {};
    let missing = [];
    c.formFields.forEach(f => {
      const el = document.getElementById(prefix + '_' + f.key);
      const val = el ? el.value.trim() : '';
      payload[f.key] = val;
      if (f.required && !val) missing.push(f.label);
    });
    if (missing.length) {
      msgEl.innerHTML = `<div class="msg error">Please fill in: ${esc(missing.join(', '))}</div>`;
      return;
    }
    btn.disabled = true; btn.textContent = 'Submitting...';
    try {
      const result = await api('submitRequest', payload);
      msgEl.innerHTML = `<div class="msg ok">Request submitted — your ticket ID is <b>${esc(result.ticketId)}</b>.</div>`;
      c.formFields.forEach(f => {
        const el = document.getElementById(prefix + '_' + f.key);
        if (el && f.type !== 'select') el.value = '';
      });
      if (onSuccess) onSuccess();
    } catch (err) {
      msgEl.innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
    }
    btn.disabled = false; btn.textContent = 'Submit request';
  });
}

document.getElementById('tabCheckBtn').addEventListener('click', () => {
  document.getElementById('tabCheckBtn').classList.add('active');
  document.getElementById('tabNewBtn').classList.remove('active');
  document.getElementById('checkTab').style.display = 'block';
  document.getElementById('newTab').style.display = 'none';
});
document.getElementById('tabNewBtn').addEventListener('click', () => {
  document.getElementById('tabNewBtn').classList.add('active');
  document.getElementById('tabCheckBtn').classList.remove('active');
  document.getElementById('newTab').style.display = 'block';
  document.getElementById('checkTab').style.display = 'none';
});

document.getElementById('staffNewToggleBtn').addEventListener('click', () => {
  const wrap = document.getElementById('staffNewWrap');
  const open = wrap.style.display === 'none';
  wrap.style.display = open ? 'block' : 'none';
  document.getElementById('staffNewToggleBtn').textContent = open ? 'Hide form' : '+ New request';
  if (open && !staffFormBuilt[currentDept]) {
    wrap.innerHTML = requestFormHtml('staff');
    wireRequestForm('staff', refreshStaff);
    staffFormBuilt[currentDept] = true;
  }
});

// ---------- Submitter flow ----------
document.getElementById('lookupBtn').addEventListener('click', lookupSubmitter);
document.getElementById('searchInput').addEventListener('keydown', e => { if(e.key==='Enter') lookupSubmitter(); });

async function lookupSubmitter(){
  const val = document.getElementById('searchInput').value.trim();
  const msgEl = document.getElementById('submitterMsg');
  msgEl.innerHTML = '';
  if (!val) { msgEl.innerHTML = '<div class="msg error">Please enter a value to search</div>'; return; }
  submitterEmail = val;
  submitterFilter = 'All';
  await refreshSubmitter();
  document.getElementById('liveNoteSubmitter').style.display = 'flex';
  clearInterval(submitterPollTimer);
  submitterPollTimer = setInterval(refreshSubmitter, POLL_MS);
}

async function refreshSubmitter(){
  const msgEl = document.getElementById('submitterMsg');
  try{
    submitterCache = await api('myRequests', { search: submitterEmail });
    msgEl.innerHTML = '';
    buildSubmitterFilterBar();
    renderSubmitterCache();
  }catch(err){
    msgEl.innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
  }
}

function buildSubmitterFilterBar(){
  const bar = document.getElementById('submitterFilterBar');
  const c = cfg();
  if (!submitterCache.length) { bar.style.display = 'none'; return; }
  const present = new Set(submitterCache.map(r => normStatus(r[c.statusField]) || 'Pending'));
  const opts = ['All', ...c.statusOptions.filter(s => present.has(s))];
  if (opts.length <= 2) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = opts.map(o => `<button data-f="${o}" class="${o===submitterFilter?'active':''}">${o}</button>`).join('');
  bar.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      submitterFilter = b.dataset.f;
      bar.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderSubmitterCache();
    });
  });
}

function renderSubmitterCache(){
  const resultsEl = document.getElementById('submitterResults');
  const msgEl = document.getElementById('submitterMsg');
  const c = cfg();
  const data = submitterFilter === 'All' ? submitterCache : submitterCache.filter(r => normStatus(r[c.statusField]) === submitterFilter);
  if (!submitterCache.length) {
    resultsEl.innerHTML = `<div class="panel empty"><div class="glyph">—</div>No requests found.</div>`;
    return;
  }
  if (!data.length) {
    resultsEl.innerHTML = `<div class="panel empty"><div class="glyph">—</div>No requests in this view.</div>`;
    return;
  }
  resultsEl.innerHTML = data.map(r => ticketHtml(r, { submitter: true })).join('');
  resultsEl.querySelectorAll('.commentBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.dataset.row;
      const ta = resultsEl.querySelector(`.commentInput[data-row="${row}"]`);
      const text = ta.value.trim();
      if (!text) return;
      btn.disabled = true;
      try{
        await api('addComment', { search: submitterEmail, rowIndex: row, comment: text });
        await refreshSubmitter();
      }catch(err){
        msgEl.innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
      }
      btn.disabled = false;
    });
  });
}

// ---------- Staff flow ----------
document.getElementById('staffToggleBtn').addEventListener('click', () => {
  document.getElementById('submitterView').style.display = 'none';
  document.getElementById('staffView').style.display = 'block';
  clearInterval(submitterPollTimer);
});
document.getElementById('backToSubmitterBtn').addEventListener('click', () => {
  document.getElementById('staffView').style.display = 'none';
  document.getElementById('submitterView').style.display = 'block';
  clearInterval(staffPollTimer);
});
document.getElementById('signOutBtn').addEventListener('click', () => {
  staffPasscode = null;
  clearInterval(staffPollTimer);
  document.getElementById('staffDashboard').style.display = 'none';
  document.getElementById('passcodeInput').value = '';
});

document.getElementById('staffLoginBtn').addEventListener('click', staffLogin);
document.getElementById('passcodeInput').addEventListener('keydown', e => { if(e.key==='Enter') staffLogin(); });

async function staffLogin(){
  const pass = document.getElementById('passcodeInput').value;
  const msgEl = document.getElementById('staffMsg');
  msgEl.innerHTML = '';
  if (!pass) return;
  try{
    await api('staffAuth', { passcode: pass });
    staffPasscode = pass;
    document.getElementById('staffDashboard').style.display = 'block';
    buildFilterBar();
    await refreshStaff();
    clearInterval(staffPollTimer);
    staffPollTimer = setInterval(refreshStaff, POLL_MS);
  }catch(err){
    msgEl.innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
  }
}

function buildFilterBar(){
  const bar = document.getElementById('filterBar');
  const c = cfg();
  const opts = ['All', ...c.statusOptions];
  bar.innerHTML = opts.map(o => `<button data-f="${o}" class="${o===staffFilter?'active':''}">${o}</button>`).join('');
  bar.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      staffFilter = b.dataset.f;
      bar.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderStaffCache();
    });
  });
}

async function refreshStaff(){
  try{
    staffCache = await api('staffRequests', { passcode: staffPasscode });
    renderStaffCache();
  }catch(err){
    document.getElementById('staffResults').innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
  }
}

function renderStaffCache(){
  const resultsEl = document.getElementById('staffResults');
  const c = cfg();
  const data = staffFilter === 'All' ? staffCache : staffCache.filter(r => normStatus(r[c.statusField]) === staffFilter);
  if (!data.length) {
    resultsEl.innerHTML = `<div class="panel empty"><div class="glyph">—</div>No requests in this view.</div>`;
    return;
  }
  resultsEl.innerHTML = data.map(r => ticketHtml(r, { staff: true })).join('');
  resultsEl.querySelectorAll('.saveBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.dataset.row;
      const status = resultsEl.querySelector(`.statusSelect[data-row="${row}"]`).value;
      const fields = {};
      resultsEl.querySelectorAll(`.ufield[data-row="${row}"]`).forEach(inp => {
        fields[inp.dataset.key] = inp.value;
      });
      btn.disabled = true; btn.textContent = 'Saving...';
      try{
        await api('updateStatus', { rowIndex: row, status, fields: JSON.stringify(fields) });
        await refreshStaff();
      }catch(err){
        alert(err.message);
      }
      btn.disabled = false; btn.textContent = 'Update';
    });
  });
}

// ---------- Init ----------
renderDeptBar();
updateSearchPanelText();
document.getElementById('newTab').innerHTML = requestFormHtml('pub');
wireRequestForm('pub');
</script>
